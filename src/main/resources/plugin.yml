name: Hounded
version: '${version}'
main: dev.marshall.hounded.HoundedPlugin
authors: [Purdze]
description: '${description}'
# Minimum supported version, not a target.
api-version: '${apiVersion}'
softdepend: [PlaceholderAPI]
# Commands are registered through Paper's Brigadier lifecycle API, so there is no commands: block.
permissions:
  hounded.admin:
    description: Use all /hounded admin commands.
    default: op
  hounded.compass:
    description: Get a replacement tracking compass with /hounded compass.
    default: true
