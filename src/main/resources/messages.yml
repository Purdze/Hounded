# Hounded messages, in MiniMessage format: https://docs.advntr.dev/minimessage/format.html
# Words in <angle_brackets> that are not formatting tags are placeholders filled in by the plugin.
# Missing keys fall back to the bundled English text. Apply changes with /hounded reload.

prefix: "<dark_gray>[<gold>Hounded</gold>]</dark_gray> "

quick-start-guide: |-
  <gold><bold>Welcome to Hounded!</bold></gold> <gray>Start a round in three steps:</gray>
  <yellow>1.</yellow> <white>/hounded runner add <gray>\<player></gray></white>
  <yellow>2.</yellow> <white>/hounded hunter add <gray>\<player></gray></white>
  <yellow>3.</yellow> <white>/hounded start <gray>[headstart seconds]</gray></white>
  <gray>Type <white>/hounded help</white> for everything else.</gray>

help: |-
  <gold><bold>Hounded</bold></gold> <gray>commands:</gray>
  <white>/hounded runner add|remove|list|clear</white> <gray>- manage runners</gray>
  <white>/hounded hunter add|remove|list|clear</white> <gray>- manage hunters</gray>
  <white>/hounded start [seconds]</white> <gray>- start a round with an optional headstart</gray>
  <white>/hounded stop</white> <gray>- stop the current round</gray>
  <white>/hounded compass</white> <gray>- get a new tracking compass (hunters)</gray>
  <white>/hounded reload</white> <gray>- reload config.yml and messages.yml</gray>

reload:
  success: "<green>Config and messages reloaded.</green>"
  failed: "<red>Reload failed, the previous config is still active. Check the console for details.</red>"

role:
  name:
    runner: "runner"
    hunter: "hunter"
    runners: "runners"
    hunters: "hunters"
  assigned: "<white><player></white> <gray>is now a</gray> <gold><role></gold><gray>.</gray>"
  removed: "<white><player></white> <gray>is no longer a</gray> <gold><role></gold><gray>.</gray>"
  not-assigned: "<white><player></white> <red>is not a</red> <gold><role></gold><red>.</red>"
  cleared: "<gray>Removed all</gray> <gold><roles></gold><gray>.</gray>"
  list: "<gold><roles></gold><gray>:</gray> <white><players></white>"
  list-empty: "<gray>There are no</gray> <gold><roles></gold><gray>.</gray>"
  locked: "<red>Roles cannot be changed while a round is running. Use /hounded stop first.</red>"

start:
  headstart: "<green>The hunt begins!</green> <gray>Runners have</gray> <white><seconds></white> <gray>seconds of headstart.</gray>"
  released: "<red><bold>The hunters have been released!</bold></red>"
  frozen: "<gray>You're frozen until the hunters are released.</gray>"
  no-runners: '<red>Add at least one runner first: /hounded runner add \<player></red>'
  no-hunters: '<red>Add at least one hunter first: /hounded hunter add \<player></red>'
  already-running: "<red>A round is already running. Use /hounded stop to end it.</red>"
  negative-headstart: "<red>The headstart must be 0 or more seconds.</red>"

stop:
  stopped: "<yellow>The round was stopped.</yellow>"
  not-running: "<red>No round is running.</red>"

round:
  runner-eliminated: "<white><player></white> <red>is out!</red>"
  runner-left: "<white><player></white> <gray>left and has</gray> <white><seconds></white> <gray>seconds to come back.</gray>"
  runner-returned: "<white><player></white> <gray>is back in the hunt.</gray>"
  runner-timed-out: "<white><player></white> <red>didn't come back in time and is out.</red>"

# The boss bar or scoreboard shown during a round.
display:
  title: "<gold><bold>Hounded</bold></gold>"
  separator: " <dark_gray>|</dark_gray> "
  headstart: "<yellow>Hunters released in</yellow> <white><time></white>"
  timer: "<gray>Hunt time</gray> <white><time></white>"
  distance: "<white><runner></white> <gray><distance>m</gray>"
  distance-portal: "<white><runner></white> <gray>is in <dimension>, portal</gray> <white><distance>m</white>"
  no-trail: "<white><runner></white><gray>: no trail yet</gray>"
  tracking-off: "<gray>Tracking is off in the Nether</gray>"

dimension:
  overworld: "the Overworld"
  nether: "the Nether"
  end: "the End"

win:
  runners: "<green><bold>The runners win!</bold></green> <gray>The dragon fell after</gray> <white><time></white><gray>.</gray>"
  hunters: "<red><bold>The hunters win!</bold></red> <gray>Every runner was caught after</gray> <white><time></white><gray>.</gray>"

compass:
  name: "<gold>Tracking Compass</gold>"
  how-to-use-auto: "<gray>Your compass tracks</gray> <white><runner></white> <gray>and updates by itself. Left-click to switch runner.</gray>"
  how-to-use-manual: "<gray>Your compass tracks</gray> <white><runner></white><gray>. Right-click to update it, left-click to switch runner.</gray>"
  now-tracking: "<gray>Now tracking</gray> <white><runner></white><gray>.</gray>"
  not-in-round: "<red>You can only get a tracking compass as a hunter during a round.</red>"
  no-data: "<yellow>No trail to follow yet: <white><runner></white> hasn't been seen in this dimension. Pointing at spawn.</yellow>"
  disabled-in-nether: "<gray>Compass tracking is disabled in the Nether.</gray>"

error:
  internal: "<red>Something went wrong. Check the console for details.</red>"
  cancelled-by-plugin: "<red>Another plugin cancelled this.</red>"
