# Hounded configuration. Apply changes with /hounded reload (no restart needed).

headstart:
  # Seconds runners get before hunters are released, when /hounded start is run without a number.
  # 0 = no headstart.
  default-seconds: 30
  # Hunters can't move, break or place blocks, attack, use or drop items, or be hurt until they are
  # released. They can still look around.
  freeze-hunters: true
  # Hunters are blind until they are released, so they can't watch where the runners go.
  blind-hunters: true

compass:
  # auto   = compasses update on their own every update-interval-ticks.
  # manual = hunters right-click the compass to update it.
  update-mode: auto
  # 20 ticks = 1 second. Minimum 1.
  update-interval-ticks: 20
  # If true, hunters' compasses do not track while the hunter is in the Nether.
  disable-in-nether-for-hunters: false

rules:
  # While hunting, a hunter can't walk while a runner is looking at them (crosshair within about 15
  # degrees, clear view, up to 64 blocks). They can still look around and attack. Nobody dies from it.
  freeze-when-looked-at: false
  # Whether runners can damage hunters, including with arrows and other projectiles.
  runner-can-attack-hunters: true
  # Whether players on the same side can damage each other, including with projectiles.
  friendly-fire: false
  # Runners who are out (died, or didn't come back in time) watch in spectator mode until the round
  # ends. If false, they keep playing but no longer count for the win.
  eliminated-runners-spectate: true
  # Seconds a runner who leaves the server has to come back before they are out. 0 = out at once.
  runner-rejoin-grace-seconds: 300

display:
  # Where the timer and distance are shown: bossbar, scoreboard or none.
  mode: bossbar
  # Show hunters the distance to the runner they are tracking.
  show-distance: true

# Show admins a short "how to start" guide in chat when they join and no round has been played yet.
quick-start-guide: true
