name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build
      - name: Check the tag matches the version
        run: |
          version=$(./gradlew properties -q | awk '/^version:/ {print $2}')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the build version $version"
            exit 1
          fi
      - run: ./gradlew build
      # A draft, so the release notes can be checked before anyone sees it.
      - name: Create a draft release with the jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" build/libs/hounded-*.jar
          --draft --verify-tag --generate-notes --title "Hounded $GITHUB_REF_NAME"
