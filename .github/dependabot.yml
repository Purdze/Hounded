version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # Compiled against the oldest supported Paper on purpose; supported versions change by decision.
      - dependency-name: "io.papermc.paper:paper-api"
    groups:
      gradle:
        patterns: ["*"]
