name: Set up the build
description: Java and Gradle for building and testing Hounded.

runs:
  using: composite
  steps:
    # Java 25 runs the tests on Paper 26.2; the plugin itself is compiled for Java 21.
    - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: temurin
        java-version: '25'
    # Also validates the Gradle wrapper jar.
    - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
