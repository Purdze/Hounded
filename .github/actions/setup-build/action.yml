name: Set up the build
description: Java and Gradle for building and testing Hounded.

runs:
  using: composite
  steps:
    # Java 25 runs the tests on Paper 26.2; the plugin itself is compiled for Java 21.
    - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: '25'
    # Also validates the Gradle wrapper jar.
    - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
